<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { USDLoader } from './usdlib/USDLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { MeshoptSimplifier } from 'https://cdn.jsdelivr.net/npm/meshoptimizer@0.22.0/meshopt_simplifier.module.js';
const P = new URLSearchParams(location.search); const lines = []; const log = (...a) => lines.push(a.join(' '));
const post = (name, body) => fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body });
try {
  await MeshoptSimplifier.ready;
  const g = await new USDLoader().loadAsync('assets/robots/so101_follower.usd');
  const meshes = g.children.find(c => c.name === 'meshes');
  const out = new THREE.Group(); out.name = 'lightwheel_so101_follower_parts';
  const ratio = +(P.get('ratio') || 0.2);
  for (const part of meshes.children) {
    const m = part.children.find(c => c.isMesh); if (!m) continue;
    let geo = m.geometry.clone(); geo.deleteAttribute('normal'); geo.deleteAttribute('uv');
    geo = mergeVertices(geo, 1e-6);
    const pos = geo.attributes.position.array, idx = new Uint32Array(geo.index.array);
    const target = Math.floor(idx.length * ratio / 3) * 3;
    const [res, err] = MeshoptSimplifier.simplify(idx, pos, 3, target, 0.002, ['LockBorder']);
    const ng = new THREE.BufferGeometry(); ng.setAttribute('position', geo.attributes.position); ng.setIndex(new THREE.BufferAttribute(res, 1));
    // compact unused vertices
    const compact = mergeVertices(ng.toNonIndexed(), 1e-6); compact.computeVertexNormals();
    const mat = m.material; const mesh = new THREE.Mesh(compact, new THREE.MeshStandardMaterial({ color: mat.color, roughness: mat.roughness ?? 0.6, metalness: mat.metalness ?? 0 }));
    mesh.name = part.name; out.add(mesh);
    log(part.name, 'tris', idx.length / 3, '->', res.length / 3, 'err', err.toFixed(4), 'color', '#' + mat.color.getHexString(), mat.name);
  }
  const glb = await new GLTFExporter().parseAsync(out, { binary: true }); await post(P.get('name') || 'so101.glb', glb); log('saved', glb.byteLength);
} catch (e) { log('FAIL', e.stack || e); }
await post('robot.log.txt', lines.join('\n')); await fetch('/__done');
</script><img src="/__wait" style="display:none">
