<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ Viewer · DisplayXR Creator Hub</title>
<meta name="description" content="Look at creations pushed to DisplayXR HQ in glasses-free 3D.">
<link rel="stylesheet" href="../shared/style.css">
<style>
  body { --accent: #ffc94a; }
  .app { grid-template-columns: 300px 1fr 0; grid-template-areas: "top top top" "left view view" "status status status"; }
  .right { display: none; }
  .gal { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 10px 12px; }
  .gal .c { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 6px; border-radius: 6px; background: var(--panel-2); border: 1px solid transparent; cursor: pointer; }
  .gal .c:hover { background: var(--panel-3); }
  .gal .c.sel { border-color: var(--accent); }
  .gal img { width: 96px; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px; background: #0d0f13; }
  .gal b { display: block; font-size: 13px; }
  .gal small { display: block; color: var(--muted); font: 10.5px var(--mono); }
  .details { padding: 10px 12px; border-top: 1px solid var(--line); }
  .details pre { white-space: pre-wrap; font: 11px var(--mono); color: var(--muted); margin: 6px 0 0; max-height: 200px; overflow: auto; }
  .empty { padding: 20px 14px; color: var(--muted); }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; grid-template-areas: "top" "view" "left" "status"; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="../" title="Creator Hub">
      <span class="logo">HQ</span>
      <span><b>HQ Viewer</b><small>DisplayXR Creator Hub</small></span>
    </a>
    <span class="spacer"></span>
    <button class="btn" id="btnDl" disabled>Download .glb</button>
    <button class="btn" id="btnDel" disabled>Remove from HQ</button>
    <a class="btn" href="../">Hub</a>
    <a class="btn primary" id="btnHQ" href="https://joehillthunder.github.io/#creator-gallery">Open HQ</a>
  </header>
  <aside class="left">
    <div class="gal" id="gal"></div>
    <div class="details" id="details" hidden></div>
  </aside>
  <main class="viewport" id="vp">
    <canvas class="stage" id="stage" tabindex="0"></canvas>
    <div class="vp-tools" id="tools" data-inline3d-overlay>
      <button class="btn sm" id="btnSpin">Turntable</button>
      <button class="btn sm" id="btnFrame">Frame</button>
    </div>
    <div class="vp-chip" id="chip" data-inline3d-overlay>
      <div class="mode-label">2D preview</div>
      <div class="vp-depth" hidden><span>Depth</span><input type="range" min="0" max="2" step="0.05"></div>
      <button class="btn sm lens" hidden></button>
    </div>
    <div class="busy" id="busy" data-inline3d-overlay hidden>LOADING&hellip;</div>
  </main>
  <aside class="right"></aside>
  <footer class="status">
    <span class="mode">HQ</span>
    <span class="grow" id="stMsg">Creations pushed from Material Forge, Vehicle Studio and Terra Studio</span>
  </footer>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
  "@displayxr/inline3d": "https://cdn.jsdelivr.net/npm/@displayxr/inline3d@1.45.1/js/inline3d.js",
  "@displayxr/inline3d/three": "https://cdn.jsdelivr.net/npm/@displayxr/inline3d@1.45.1/js/inline3d-three.js"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
